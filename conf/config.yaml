model:
  keep_special: false
  optim:
    lr: 1e-3
    weight_decay: 1e-2
    betas: [0.9, 0.999]

tagger:
  hidden: 256
  dropout: 0.1
  class_weighted: false

data:
  shuffle: false
  max_length: 512
  dataset: wikiann
  subset: 1.0
  encoder:
    family: bert
    name: null
    pooling: mean

train:
  epochs: 10

runtime:
  seed: 42
  grid: false
  threads: 4
  interop_threads: 1
  device: cpu
  tf32: true
  data:
    rebuild: false
    test_subset: null
    batch_size: 64
    num_workers: 2
  eval:
    short_log: false
